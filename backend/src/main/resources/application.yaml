spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/ncomics
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  access-token-ms: ${JWT_ACCESS_TOKEN_MS:900000}
  refresh-token-ms: ${JWT_REFRESH_TOKEN_MS:604800000}
  secret-key: ${JWT_SECRET:pc-builder-secret-key-super-secure-2026}

cookie:
  refresh-name: ${REFRESH_COOKIE_NAME:refresh_token}
  secure: ${COOKIE_SECURE:false}
  same-site: ${COOKIE_SAME_SITE:Lax}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

upload:
  dir: ./uploads

logging:
  level:
    root: INFO
    com.ncomics.backend: DEBUG
    org.springframework.web: WARN
    org.hibernate: WARN

  file:
    name: ./logs/application.log